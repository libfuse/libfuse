# Every CI build configuration. Each entry is forwarded verbatim to
# test/ci-build.sh by test/ci/run-matrix.py. "workflows" names the workflows
# that run it; <workflow>-bufpool runs it once more with an io-uring buffer
# pool.
configs:
  - config: gcc
    cc: gcc
    workflows: [pr-ci]
  - config: gcc-root
    cc: gcc
    root: true
    workflows: [pr-ci]
  - config: gcc-io-uring
    cc: gcc
    io_uring: true
    workflows: [pr-ci, kernel-vm, kernel-vm-bufpool]
  - config: gcc-io-uring-root
    cc: gcc
    root: true
    io_uring: true
    workflows: [pr-ci, kernel-vm, kernel-vm-bufpool]
  - config: gcc-valgrind
    cc: gcc
    valgrind: true
    workflows: [pr-ci]
  - config: gcc-9-valgrind
    cc: gcc-9
    valgrind: true
    workflows: [pr-ci]
  - config: gcc-10-valgrind
    cc: gcc-10
    valgrind: true
    meson_opts:
      - -Dc_args=-flto=auto
    workflows: [pr-ci]
  - config: clang
    cc: clang
    cxx: clang++
    workflows: [pr-ci]
  - config: clang-san
    cc: clang
    cxx: clang++
    sanitize: true
    workflows: [pr-ci]
  - config: clang-san-root
    cc: clang
    cxx: clang++
    sanitize: true
    root: true
    workflows: [pr-ci]
  - config: clang-san-io-uring
    cc: clang
    cxx: clang++
    sanitize: true
    io_uring: true
    workflows: [pr-ci]
  - config: clang-san-io-uring-root
    cc: clang
    cxx: clang++
    sanitize: true
    root: true
    io_uring: true
    workflows: [pr-ci, kernel-vm, kernel-vm-bufpool]
  - config: clang-san-nosymver
    cc: clang
    cxx: clang++
    sanitize: true
    meson_opts:
      - -Ddisable-libc-symbol-version=true
    workflows: [pr-ci]
  - config: clang-san-noiouring
    cc: clang
    cxx: clang++
    sanitize: true
    meson_opts:
      - -Denable-io-uring=false
    workflows: [pr-ci]
  # The daemons a test backgrounds get synchronous FUSE_INIT
  # everywhere else, so this is the only job running the classic path.
  - config: clang-san-nosyncinit
    cc: clang
    cxx: clang++
    sanitize: true
    meson_opts:
      - -Dsync-init=never
    workflows: [pr-ci]
  - config: clang-san-m32
    cc: clang
    cxx: clang++
    sanitize: true
    meson_opts:
      - -Dc_args=-m32
      - -Dcpp_args=-m32
      - -Dc_link_args=-m32
      - -Dcpp_link_args=-m32
      - --pkg-config-path=/usr/lib/i386-linux-gnu/pkgconfig
    workflows: [pr-ci]
