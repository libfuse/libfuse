---
name: 'Build & Test'
on:
  push:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'  # This will match branches like 3.17, 3.18, 4.0, etc.
  pull_request:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  matrix:
    runs-on: ubuntu-latest
    outputs:
      jobs: ${{ steps.matrix.outputs.jobs }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - run: pip install pyyaml
      - id: matrix
        run: echo "jobs=$(test/ci/run-matrix.py --github-matrix pr-ci)" >> "$GITHUB_OUTPUT"

  build:
    needs: matrix
    runs-on: ubuntu-latest
    name: "build (ubuntu-latest, ${{ matrix.config }})"
    strategy:
      # One configuration failing must not cancel its siblings.
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.jobs) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          ./.github/workflows/install-ubuntu-dependencies.sh --full

      - run: test/ci/prepare-runner.sh ${{ github.workspace }}/fuse-tests

      - run: test/ci/run-matrix.py --config ${{ matrix.config }}
               --work-dir ${{ github.workspace }}/fuse-tests

      - name: Print failed test logs
        if: failure()
        run: |
          test/run-tests.py --print-logged-errors fuse-tests/run

          echo "::group::dmesg"
          sudo dmesg -T | tail -n 300
          echo "::endgroup::"

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-ubuntu-latest-${{ matrix.config }}
          # A test killed on timeout runs no cleanup, so a socket it bound in
          # its log directory is still there; nothing in one can be uploaded.
          path: |
            fuse-tests/run/
            fuse-tests/build-*/meson-logs/
            !fuse-tests/run/**/core.*
            !fuse-tests/run/**/mnt
            !fuse-tests/run/**/*.sock
          if-no-files-found: ignore
          retention-days: 14

  # master's branch protection still requires this exact context name
  # from when the build job's matrix had only the os dimension.
  build-required-check:
    name: build (ubuntu-latest)
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[[ "${{ needs.build.result }}" == "success" ]]'

  doxygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies (Ubuntu)
        run: |
          ./.github/workflows/install-ubuntu-dependencies.sh --full
      - run: test/ci/doxygen.sh

