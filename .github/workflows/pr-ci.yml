---
name: 'Build & Test'
on:
  push:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'  # This will match branches like 3.17, 3.18, 4.0, etc.
  pull_request:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  build:
    runs-on: '${{ matrix.os }}'
    strategy:
      # One configuration failing must not cancel its siblings.
      fail-fast: false
      matrix:
        os:
          # 18.04 does not work because of ‘no_sanitize’ attribute
          # cc1: all warnings being treated as errors
          # - ubuntu-18.04
          - ubuntu-latest
        # One entry per CI job. Every build/test parameter is spelled out via
        # include below and forwarded verbatim to test/ci-build.sh -- nothing
        # about what a job builds or which pass it runs is hidden in a shell
        # case branch.
        config:
          - gcc
          - gcc-valgrind
          - gcc-9-valgrind
          - gcc-10-valgrind
          - clang
          - clang-san
          - clang-san-nosymver
          - clang-san-noiouring
          - clang-san-m32
        # include entries must repeat the config key: an include naming none
        # of the base matrix's own keys would be folded into every
        # combination instead of just its own.
        include:
          - config: gcc
            cc: gcc
          - config: gcc-valgrind
            cc: gcc
            valgrind: true
          - config: gcc-9-valgrind
            cc: gcc-9
            valgrind: true
            pass: root
          - config: gcc-10-valgrind
            cc: gcc-10
            valgrind: true
            meson_opts:
              - -Dc_args=-flto=auto
            pass: root
          - config: clang
            cc: clang
            cxx: clang++
          - config: clang-san
            cc: clang
            cxx: clang++
            sanitize: true
          - config: clang-san-nosymver
            cc: clang
            cxx: clang++
            sanitize: true
            meson_opts:
              - -Ddisable-libc-symbol-version=true
          - config: clang-san-noiouring
            cc: clang
            cxx: clang++
            sanitize: true
            meson_opts:
              - -Denable-io-uring=false
          - config: clang-san-m32
            cc: clang
            cxx: clang++
            sanitize: true
            meson_opts:
              - -Dc_args=-m32
              - -Dcpp_args=-m32
              - -Dc_link_args=-m32
              - -Dcpp_link_args=-m32
              - --pkg-config-path=/usr/lib/i386-linux-gnu/pkgconfig
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          ./.github/workflows/install-ubuntu-dependencies.sh --full

      - run: test/ci/prepare-runner.sh ${{ github.workspace }}/fuse-tests

      - run: test/ci-build.sh --name ${{ matrix.config }}
               --cc ${{ matrix.cc }}
               ${{ matrix.cxx && format('--cxx {0}', matrix.cxx) || '' }}
               ${{ matrix.sanitize && '--sanitize' || '' }}
               ${{ matrix.valgrind && '--valgrind' || '' }}
               ${{ matrix.meson_opts && format('--meson-opt {0}', join(matrix.meson_opts, ' --meson-opt ')) || '' }}
               ${{ matrix.pass && format('--pass {0}', matrix.pass) || '' }}
               --work-dir ${{ github.workspace }}/fuse-tests

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.config }}
          path: |
            fuse-tests/run/
            fuse-tests/build-*/meson-logs/
            !fuse-tests/run/**/core.*
            !fuse-tests/run/**/mnt
          if-no-files-found: ignore
          retention-days: 14

  # master's branch protection still requires this exact context name
  # from when the build job's matrix had only the os dimension.
  build-required-check:
    name: build (ubuntu-latest)
    needs: build
    if: always()
    runs-on: ubuntu-latest
    steps:
      - run: '[[ "${{ needs.build.result }}" == "success" ]]'

  doxygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies (Ubuntu)
        run: |
          ./.github/workflows/install-ubuntu-dependencies.sh --full
      - run: test/ci/doxygen.sh

