---
name: 'Build & Test'
on:
  push:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'  # This will match branches like 3.17, 3.18, 4.0, etc.
  pull_request:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  build:
    runs-on: '${{ matrix.os }}'
    strategy:
      # One configuration failing must not cancel its siblings.
      fail-fast: false
      matrix:
        os:
          # 18.04 does not work because of ‘no_sanitize’ attribute
          # cc1: all warnings being treated as errors
          # - ubuntu-18.04
          - ubuntu-latest
        # What each name builds is one case branch in test/ci/configs.sh.
        config:
          - gcc
          - gcc-9
          - gcc-10
          - clang
          - san
          - san-nosymver
          - san-noiouring
          - san-m32
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          ./.github/workflows/install-ubuntu-dependencies.sh --full

      - run: test/ci/prepare-runner.sh ${{ github.workspace }}/fuse-tests

      - run: test/ci/configs.sh ${{ matrix.config }}
             --work-dir ${{ github.workspace }}/fuse-tests

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-${{ matrix.os }}-${{ matrix.config }}
          path: |
            fuse-tests/run/
            !fuse-tests/run/**/core.*
            !fuse-tests/run/**/mnt
          if-no-files-found: ignore
          retention-days: 14

  doxygen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies (Ubuntu)
        run: |
          ./.github/workflows/install-ubuntu-dependencies.sh --full
      - run: test/ci/doxygen.sh

