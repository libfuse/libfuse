---
# TODO: add NetBSD and DragonFlyBSD
name: 'Build & Test (FreeBSD)'
on:
  push:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'

jobs:
  build_test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Install qemu
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage
        echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
        sudo udevadm control --reload-rules
        sudo udevadm trigger --name-match=kvm
    # The stock FreeBSD cloud image, ~2 GB unpacked, that every run boots an
    # overlay on. Each job starts on an empty runner, so without this it is
    # downloaded from download.freebsd.org on every run.
    #
    # actions/cache keeps a tarball per key in GitHub's per-repository cache
    # store. Its step below asks for the key and unpacks the tarball to
    # path, so bsd-vm-run.sh finds the image and skips its download; on a
    # miss the directory stays empty, the script downloads, and the
    # action's post-job hook uploads what is in path under that key. The
    # key carries the release, so a new release starts with a miss.
    - name: Image cache
      id: image
      run: test/ci/bsd-vm-run.sh --print-cache >> "$GITHUB_OUTPUT"
    - name: Cache FreeBSD image
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.image.outputs.dir }}
        key: freebsd-vm-image-${{ steps.image.outputs.release }}
    - name: Build
      run: test/ci/bsd-vm-run.sh --logs-out fuse-tests
    - name: Print failed test logs
      if: failure()
      run: test/run-tests.py --print-logged-errors fuse-tests/run

    - name: Upload test logs
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: test-logs-freebsd
        path: |
          fuse-tests/
          !fuse-tests/**/core.*
          !fuse-tests/**/mnt
          !fuse-tests/**/*.sock
        # A run that passed deletes its own directory.
        if-no-files-found: ignore
        retention-days: 14
