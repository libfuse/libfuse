---
# TODO: integrate into matrix.os in pr-ci.yml
# TODO: add NetBSD and DragonFlyBSD
name: 'Build (FreeBSD)'
on:
  push:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'

jobs:
  build_bsd:
    runs-on: ubuntu-latest
    name: Build under FreeBSD
    steps:
    - name: Checkout
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: Build
      uses: vmactions/freebsd-vm@d0518f912576ae759075aa00fb9fe27037940271 # v1
      with:
        usesh: true
        # bash because FreeBSD has none in base and common.sh uses arrays,
        # python3 for checks.py, and gdb because the base debugger is lldb --
        # one backtrace back-end keeps the runner's output identical on both
        # platforms.
        prepare: |
          pkg install -y meson ninja bash python3 gdb
        run: |
          kldload fusefs || true
          sysctl kern.coredump=1
          # Mirrors the core.%e.%p Ubuntu is set to, so a core lands in the
          # test's own log directory under the same name on both platforms.
          sysctl kern.corefile=core.%N.%P
          sysctl vfs.usermount=1
          mkdir build
          cd build
          meson setup ..
          ninja -v
          # Not yet enabled on this job; kept here for the follow-up that
          # turns this into a test run.
          # ../test/run-tests.py --build-dir . --run-dir "$PWD/../fuse-tests"
    # Not yet enabled on this job; kept here for the follow-up that turns
    # this into a test run. The run directory sits in the workspace, which
    # the action copies back out of the VM; without this step a FreeBSD
    # failure leaves nothing to read.
    # - name: Upload test logs
    #   if: always()
    #   uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
    #   with:
    #     name: test-logs-freebsd
    #     path: |
    #       fuse-tests/
    #       !fuse-tests/**/core.*
