---
name: 'libfuse ABI check against previous major release'

on:
  push:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'  # This will match branches like 3.17, 3.18, 4.0, etc.
  pull_request:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'
permissions:
  contents: read

jobs:
  abi:
    runs-on: '${{ matrix.os }}'
    strategy:
      matrix:
        os:
          - ubuntu-latest

    steps:
      - name: Install dependencies (Ubuntu)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get -y install abigail-tools clang gcc liburing-dev libnuma-dev

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: current
          fetch-depth: 0  # Fetch all history and tags

      - name: Determine previous major release tag
        id: prev_release
        run: |
          cd current
          PREV_TAG=$(.github/workflows/find_previous_release_tag.sh)
          echo "prev_tag=$PREV_TAG" >> $GITHUB_OUTPUT

      - uses: actions/checkout@8e8c483db84b4bee98b60c0593521ed34d9990e8 # v6.0.1
        with:
          path: previous
          ref: ${{ steps.prev_release.outputs.prev_tag }}

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        run: |
          pip install -r current/requirements.txt

      - name: Run ABI check
        run: |
          echo "Previous release tag: ${{ steps.prev_release.outputs.prev_tag }}"
          current/.github/workflows/abicheck.sh --current-dir current --previous-dir previous
