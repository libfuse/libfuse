name: 'Build & Test (kernel VM)'
on:
  push:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'
  pull_request:
    branches:
      - master
      - 'fuse-[0-9]+.[0-9]+*'

permissions:
  contents: read

jobs:
  kernel-vm:
    # virtme-ng fetches a release candidate only from 1.30 on, 24.04 ships 1.22
    runs-on: ubuntu-26.04
    name: '${{ matrix.config }}'
    strategy:
      fail-fast: false
      matrix:
        # Every io-uring configuration runs a second time with a buffer pool.
        config:
          - gcc-io-uring
          - gcc-io-uring-root
          - clang-san-io-uring-root
          - gcc-io-uring-bufpool
          - gcc-io-uring-bufpool-root
          - clang-san-io-uring-bufpool-root
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install dependencies (Ubuntu)
        run: |
          ./.github/workflows/install-ubuntu-dependencies.sh --kernel-vm

      - name: Let qemu open /dev/kvm
        run: |
          # Adding the runner's user to the kvm group would not reach the
          # shell it already has, so widen the device instead. Without this
          # qemu falls back to emulation and the suite takes hours.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' |
              sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - run: test/ci/run-matrix.py --kernel latest-rc
               --config ${{ matrix.config }}
               --work-dir ${{ github.workspace }}/fuse-tests

      - name: Print failed test logs
        if: failure()
        run: |
          # A test's name is <category>/<leaf>, so its logs/ sits three
          # levels under fuse-tests/run/: <config>/<category>/<leaf>/logs.
          for dir in fuse-tests/run/*/*/*/logs; do
              [ -d "$dir" ] || continue
              label=${dir#fuse-tests/run/}
              label=${label%/logs}
              echo "::group::${label}"
              for out in "$dir"/*.sh "$dir"/*.out; do
                  [ -e "$out" ] || continue
                  echo "--- ${out##*/} ---"
                  tail -n 100 "$out"
              done
              # The stack dumps and the process table are the whole report on
              # a timeout, and a tail of a backtrace keeps its least useful
              # end -- print them whole.
              for out in "$dir"/*.txt; do
                  [ -e "$out" ] || continue
                  echo "--- ${out##*/} ---"
                  cat "$out"
              done
              echo "::endgroup::"
              echo
              echo
          done

      - name: Upload test logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-logs-kernel-vm-${{ matrix.config }}
          path: |
            fuse-tests/
            !fuse-tests/**/core.*
            !fuse-tests/**/*.sock
          if-no-files-found: ignore
          retention-days: 14
